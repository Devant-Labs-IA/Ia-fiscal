# Configuração versionada de desenvolvimento e testes internos.
# O project_id remoto não é usado aqui para promover mudanças automaticamente.
project_id = "ia-fiscal"

[functions.ia-fiscal-worker]
verify_jwt = true

[functions.ia-fiscal-search]
# Preserva o JWT. AAL1 é aceito somente nos domínios internos reconhecidos;
# a produção continua sujeita ao gate AAL2.
verify_jwt = true

[functions.ia-fiscal-knowledge-ingest]
# Chamadas do pg_net usam segredo aleatório do Vault, não JWT. O handler valida
# hash, janela temporal e nonce único em RPC service-only antes de qualquer I/O.
verify_jwt = false

[functions.ia-fiscal-knowledge-embed]
# Mesmo gate Vault/nonce do orquestrador; nunca aceita chave versionada no repositório.
verify_jwt = false

[functions.ia-fiscal-knowledge-search]
# Preserva o JWT do usuário; tenant e papel continuam validados pela RPC híbrida.
verify_jwt = true

[functions.ia-fiscal-knowledge-ocr]
# GitHub Actions envia um OIDC JWT do issuer oficial. O gateway Supabase não
# conhece esse emissor, portanto o handler valida assinatura/JWKS, audience,
# repository/ref/workflow/environment e anti-replay antes de usar service_role.
verify_jwt = false

[functions.ia-fiscal-copilot]
# O Copiloto preserva o JWT e opera somente por RPC autorizadora read-only.
# Chaves de modelo ficam exclusivamente nos secrets da Edge Function.
verify_jwt = true

[functions.ia-fiscal-email-dispatch]
# Envio manual restrito a usuário autenticado e destinatário da allowlist interna.
verify_jwt = true

[functions.ia-fiscal-email-webhook]
# Webhook público do provedor; o handler exige assinatura Svix válida antes de processar.
verify_jwt = false

[functions.ia-fiscal-cigis-gateway]
# O gateway preserva o JWT e resolve o escopo autorizado antes de consultar o CIGIS.
verify_jwt = true
