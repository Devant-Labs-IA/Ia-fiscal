name: One-time Supabase Auth redirect fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-supabase-auth-redirect.yml

permissions:
  contents: read

concurrency:
  group: one-time-supabase-auth-redirect-fix
  cancel-in-progress: false

jobs:
  patch-auth-config:
    name: Set and verify production Auth URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: qvgenxcrdrqyiyozxtdt
      SITE_URL: https://ia-fiscal-homologacao.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_PAT || secrets.SUPABASE_TOKEN }}

    steps:
      - name: Validate management credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Credencial ausente::Nenhum secret SUPABASE_ACCESS_TOKEN, SUPABASE_PAT ou SUPABASE_TOKEN está configurado neste repositório."
            exit 2
          fi

      - name: Update and verify Auth URL configuration
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          current_file="$(mktemp)"
          updated_file="$(mktemp)"
          trap 'rm -f "$current_file" "$updated_file"' EXIT

          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "$api" > "$current_file"

          current_allow_list="$(jq -r '.uri_allow_list // ""' "$current_file")"
          exact_url="$SITE_URL"
          wildcard_url="${SITE_URL}/**"

          next_allow_list="$(
            jq -nr \
              --arg current "$current_allow_list" \
              --arg exact "$exact_url" \
              --arg wildcard "$wildcard_url" '
                ($current
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))) as $existing
                | ($existing + [$exact, $wildcard] | unique | join(","))
              '
          )"

          payload="$(
            jq -n \
              --arg site_url "$SITE_URL" \
              --arg uri_allow_list "$next_allow_list" \
              '{site_url: $site_url, uri_allow_list: $uri_allow_list}'
          )"

          curl --silent --show-error --fail \
            --request PATCH \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$api" > /dev/null

          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "$api" > "$updated_file"

          actual_site_url="$(jq -r '.site_url // ""' "$updated_file")"
          actual_allow_list="$(jq -r '.uri_allow_list // ""' "$updated_file")"

          if [ "$actual_site_url" != "$SITE_URL" ]; then
            echo "::error title=Falha de validação::O Site URL retornado pelo Supabase não corresponde ao endereço publicado."
            exit 3
          fi

          jq -en \
            --arg allow "$actual_allow_list" \
            --arg exact "$exact_url" \
            --arg wildcard "$wildcard_url" '
              ($allow | split(")") as $unused
              | ($allow | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $urls
              | (($urls | index($exact)) != null and ($urls | index($wildcard)) != null)
            ' > /dev/null

          echo "Supabase Auth URL configuration updated and verified."
