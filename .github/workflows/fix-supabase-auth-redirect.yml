name: One-time Supabase Auth redirect fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-supabase-auth-redirect.yml

permissions:
  contents: write

concurrency:
  group: one-time-supabase-auth-redirect-fix
  cancel-in-progress: false

jobs:
  patch-auth-config:
    name: Set and verify production Auth URLs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: qvgenxcrdrqyiyozxtdt
      SITE_URL: https://ia-fiscal-homologacao.vercel.app
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_PAT || secrets.SUPABASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update and verify Auth URL configuration
        id: repair
        shell: bash
        run: |
          set -uo pipefail

          result="unknown_failure"
          detail="unclassified"
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth"
          current_file="$(mktemp)"
          updated_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$current_file" "$updated_file" "$body_file"' EXIT

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            result="missing_management_credential"
            detail="repository_secret_not_configured"
          else
            current_http="$(curl --silent --show-error \
              --output "$current_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              "$api" || true)"

            if [ "$current_http" != "200" ]; then
              result="current_config_fetch_failed"
              detail="management_api_http_${current_http:-transport_error}"
            else
              current_allow_list="$(jq -r '.uri_allow_list // ""' "$current_file")"
              exact_url="$SITE_URL"
              wildcard_url="${SITE_URL}/**"

              next_allow_list="$(
                jq -nr \
                  --arg current "$current_allow_list" \
                  --arg exact "$exact_url" \
                  --arg wildcard "$wildcard_url" '
                    ($current
                      | split(",")
                      | map(gsub("^\\s+|\\s+$"; ""))
                      | map(select(length > 0))) as $existing
                    | ($existing + [$exact, $wildcard] | unique | join(","))
                  '
              )"

              payload="$(
                jq -n \
                  --arg site_url "$SITE_URL" \
                  --arg uri_allow_list "$next_allow_list" \
                  '{site_url: $site_url, uri_allow_list: $uri_allow_list}'
              )"

              patch_http="$(curl --silent --show-error \
                --request PATCH \
                --output "$body_file" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "$payload" \
                "$api" || true)"

              if [ "$patch_http" != "200" ]; then
                result="patch_failed"
                detail="management_api_http_${patch_http:-transport_error}"
              else
                verify_http="$(curl --silent --show-error \
                  --output "$updated_file" \
                  --write-out "%{http_code}" \
                  --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                  "$api" || true)"

                if [ "$verify_http" != "200" ]; then
                  result="verification_fetch_failed"
                  detail="management_api_http_${verify_http:-transport_error}"
                else
                  actual_site_url="$(jq -r '.site_url // ""' "$updated_file")"
                  actual_allow_list="$(jq -r '.uri_allow_list // ""' "$updated_file")"

                  if [ "$actual_site_url" != "$SITE_URL" ]; then
                    result="verification_failed"
                    detail="site_url_mismatch"
                  elif ! jq -en \
                    --arg allow "$actual_allow_list" \
                    --arg exact "$exact_url" \
                    --arg wildcard "$wildcard_url" '
                      ($allow | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $urls
                      | (($urls | index($exact)) != null and ($urls | index($wildcard)) != null)
                    ' > /dev/null; then
                    result="verification_failed"
                    detail="redirect_allow_list_mismatch"
                  else
                    result="success"
                    detail="site_url_and_redirect_allow_list_verified"
                  fi
                fi
              fi
            fi
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "Repair result: $result ($detail)"

      - name: Record sanitized verification result
        if: always()
        shell: bash
        env:
          REPAIR_RESULT: ${{ steps.repair.outputs.result || 'workflow_interrupted' }}
          REPAIR_DETAIL: ${{ steps.repair.outputs.detail || 'no_step_output' }}
        run: |
          set -euo pipefail
          mkdir -p .automation
          jq -n \
            --arg result "$REPAIR_RESULT" \
            --arg detail "$REPAIR_DETAIL" \
            --arg site_url "$SITE_URL" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg checked_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{result: $result, detail: $detail, site_url: $site_url, run_id: $run_id, checked_at: $checked_at}' \
            > .automation/supabase-auth-redirect-result.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .automation/supabase-auth-redirect-result.json
          git commit -m "chore(auth): record redirect repair verification" || exit 0
          git push origin HEAD:main

      - name: Enforce successful repair
        if: steps.repair.outputs.result != 'success'
        shell: bash
        run: |
          echo "::error title=Supabase Auth redirect repair failed::${{ steps.repair.outputs.result }} — ${{ steps.repair.outputs.detail }}"
          exit 1
