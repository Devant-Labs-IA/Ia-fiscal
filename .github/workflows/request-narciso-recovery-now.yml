name: Request fresh Narciso recovery token

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/request-narciso-recovery-now.yml

permissions:
  contents: read

jobs:
  request-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request password recovery
        shell: bash
        env:
          SUPABASE_URL: https://qvgenxcrdrqyiyozxtdt.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Frt254fLpExL7A52zWNCnw_ZXLP7k33
          RECOVERY_EMAIL: luisnarcizo@uol.com.br
          REDIRECT_TO: https://ia-fiscal-homologacao.vercel.app/recuperar-acesso.html
        run: |
          set -euo pipefail
          encoded_redirect="$(jq -rn --arg value "$REDIRECT_TO" '$value | @uri')"
          curl --silent --show-error --fail \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg email "$RECOVERY_EMAIL" '{email: $email}')" \
            "${SUPABASE_URL}/auth/v1/recover?redirect_to=${encoded_redirect}"
