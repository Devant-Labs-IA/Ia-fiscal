name: Deploy internal-test backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/homologacao-realista-gauntlet
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/ia-fiscal-copilot/**"
      - "supabase/functions/ia-fiscal-email-dispatch/**"
      - "supabase/functions/ia-fiscal-email-webhook/**"
      - "supabase/functions/ia-fiscal-cigis-gateway/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-internal-test-backend.yml"

permissions:
  contents: read

concurrency:
  group: deploy-internal-test-backend
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: qvgenxcrdrqyiyozxtdt

jobs:
  validate:
    name: Validate application and backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_APP_ENV: assisted_operation
          VITE_DATA_MODE: mock
          VITE_ALLOW_DEMO: "true"
          VITE_SUPABASE_URL: https://qvgenxcrdrqyiyozxtdt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Frt254fLpExL7A52zWNCnw_ZXLP7k33
          VITE_MUNICIPALITY_LABEL: Cordeirópolis/SP
          VITE_MUNICIPALITY_IBGE: "3512407"
          VITE_APP_TIMEZONE: America/Sao_Paulo
        run: npm run build

  deploy:
    name: Apply database and deploy Edge Functions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: internal-test
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview database changes
        run: supabase db push --dry-run --include-all

      - name: Apply database migrations
        run: supabase db push --include-all

      - name: Deploy Copilot
        run: supabase functions deploy ia-fiscal-copilot --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy internal email sender
        run: supabase functions deploy ia-fiscal-email-dispatch --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy signed email webhook
        run: supabase functions deploy ia-fiscal-email-webhook --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt

      - name: Deploy CIGIS gateway
        run: supabase functions deploy ia-fiscal-cigis-gateway --project-ref "$SUPABASE_PROJECT_ID" --use-api
