name: Apply password-only homologation access

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-password-only-homologation.yml

permissions:
  contents: write

concurrency:
  group: apply-password-only-homologation
  cancel-in-progress: true

jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MFA gate and login copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          auth_path = Path("src/auth/AuthContext.tsx")
          auth = auth_path.read_text(encoding="utf-8")
          start_marker = "        const supabase = getSupabaseClient();\n        const assurance = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();\n"
          clear_marker = "\n        setMfaEnrollment(null);\n        setMfaFactorId(null);\n"

          if auth.count(start_marker) != 1:
              raise SystemExit("AuthContext MFA start marker did not match exactly once")
          start = auth.index(start_marker)
          clear_at = auth.index(clear_marker, start)
          mfa_block = auth[start:clear_at]
          wrapped_mfa = (
              "        if (runtimeConfig.requireMfa) {\n"
              + textwrap.indent(mfa_block, "  ")
              + "        }\n"
          )
          auth_path.write_text(auth[:start] + wrapped_mfa + auth[clear_at:], encoding="utf-8")

          boundary_path = Path("src/auth/AuthBoundary.tsx")
          boundary = boundary_path.read_text(encoding="utf-8")
          old_copy = '''        <p className="mt-5 text-sm text-muted-foreground">
          Entre, cadastre uma conta ou recupere sua senha. Todo acesso a dados exige vínculo
          aprovado e verificação em duas etapas.
        </p>
'''
          new_copy = '''        <p className="mt-5 text-sm text-muted-foreground">
          {runtimeConfig.requireMfa
            ? "Entre, cadastre uma conta ou recupere sua senha. Todo acesso a dados exige vínculo aprovado e verificação em duas etapas."
            : "Entre com seu e-mail e sua senha. O acesso aos dados depende apenas do vínculo aprovado."}
        </p>
'''
          if boundary.count(old_copy) != 1:
              raise SystemExit("AuthBoundary login copy did not match exactly once")
          boundary_path.write_text(boundary.replace(old_copy, new_copy), encoding="utf-8")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and format
        run: |
          npm ci
          npx prettier --write src/config/runtime.ts src/auth/AuthContext.tsx src/auth/AuthBoundary.tsx

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/runtime.ts src/auth/AuthContext.tsx src/auth/AuthBoundary.tsx
          git commit -m "fix(auth): allow password-only access in homologation"
          git pull --rebase origin main
          git push origin HEAD:main
