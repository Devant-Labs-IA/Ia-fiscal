name: Apply password-only homologation access

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-password-only-homologation.yml

permissions:
  contents: write

concurrency:
  group: apply-password-only-homologation
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch MFA gate and login copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          auth_path = Path("src/auth/AuthContext.tsx")
          auth = auth_path.read_text(encoding="utf-8")
          old_auth = '''        const supabase = getSupabaseClient();
          const assurance = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
          if (assurance.error) throw assurance.error;
          if (
            requestId !== accessRequestRef.current ||
            principalRef.current !== nextPrincipal ||
            recoveryRef.current
          ) {
            return null;
          }

          if (assurance.data.currentLevel !== "aal2") {
            const factors = await supabase.auth.mfa.listFactors();
            if (factors.error) throw factors.error;
            if (
              requestId !== accessRequestRef.current ||
              principalRef.current !== nextPrincipal ||
              recoveryRef.current
            ) {
              return null;
            }

            const verifiedTotp = factors.data.totp[0] ?? null;
            setAccess(null);
            setMunicipalityContexts([]);
            if (verifiedTotp) {
              setMfaEnrollment(null);
              setMfaFactorId(verifiedTotp.id);
            }
            setStatus(verifiedTotp ? "mfa_required" : "mfa_enrollment_required");
            return null;
          }

          setMfaEnrollment(null);
          setMfaFactorId(null);
'''
          new_auth = '''        if (runtimeConfig.requireMfa) {
            const supabase = getSupabaseClient();
            const assurance = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
            if (assurance.error) throw assurance.error;
            if (
              requestId !== accessRequestRef.current ||
              principalRef.current !== nextPrincipal ||
              recoveryRef.current
            ) {
              return null;
            }

            if (assurance.data.currentLevel !== "aal2") {
              const factors = await supabase.auth.mfa.listFactors();
              if (factors.error) throw factors.error;
              if (
                requestId !== accessRequestRef.current ||
                principalRef.current !== nextPrincipal ||
                recoveryRef.current
              ) {
                return null;
              }

              const verifiedTotp = factors.data.totp[0] ?? null;
              setAccess(null);
              setMunicipalityContexts([]);
              if (verifiedTotp) {
                setMfaEnrollment(null);
                setMfaFactorId(verifiedTotp.id);
              }
              setStatus(verifiedTotp ? "mfa_required" : "mfa_enrollment_required");
              return null;
            }
          }

          setMfaEnrollment(null);
          setMfaFactorId(null);
'''
          if auth.count(old_auth) != 1:
              raise SystemExit("AuthContext MFA block did not match exactly once")
          auth_path.write_text(auth.replace(old_auth, new_auth), encoding="utf-8")

          boundary_path = Path("src/auth/AuthBoundary.tsx")
          boundary = boundary_path.read_text(encoding="utf-8")
          old_copy = '''        <p className="mt-5 text-sm text-muted-foreground">
          Entre, cadastre uma conta ou recupere sua senha. Todo acesso a dados exige vínculo
          aprovado e verificação em duas etapas.
        </p>
'''
          new_copy = '''        <p className="mt-5 text-sm text-muted-foreground">
          {runtimeConfig.requireMfa
            ? "Entre, cadastre uma conta ou recupere sua senha. Todo acesso a dados exige vínculo aprovado e verificação em duas etapas."
            : "Entre com seu e-mail e sua senha. O acesso aos dados depende apenas do vínculo aprovado."}
        </p>
'''
          if boundary.count(old_copy) != 1:
              raise SystemExit("AuthBoundary login copy did not match exactly once")
          boundary_path.write_text(boundary.replace(old_copy, new_copy), encoding="utf-8")
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write src/config/runtime.ts src/auth/AuthContext.tsx src/auth/AuthBoundary.tsx

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Homologation build
        env:
          VITE_APP_ENV: assisted_operation
          VITE_DATA_MODE: supabase
          VITE_ALLOW_DEMO: "false"
          VITE_ALLOW_SIGNUP: "true"
          VITE_SUPABASE_URL: https://qvgenxcrdrqyiyozxtdt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Frt254fLpExL7A52zWNCnw_ZXLP7k33
          VITE_MUNICIPALITY_LABEL: Cordeirópolis/SP
          VITE_MUNICIPALITY_IBGE: "3512407"
          VITE_APP_TIMEZONE: America/Sao_Paulo
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/runtime.ts src/auth/AuthContext.tsx src/auth/AuthBoundary.tsx
          git commit -m "fix(auth): allow password-only access in homologation"
          git push origin HEAD:main
