name: Governed knowledge OCR

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ia-fiscal-governed-knowledge-ocr-production
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR official legal artifact
    runs-on: ubuntu-24.04
    environment: knowledge-ocr
    timeout-minutes: 65

    env:
      OCR_EDGE_URL: https://qvgenxcrdrqyiyozxtdt.supabase.co/functions/v1/ia-fiscal-knowledge-ocr
      OCR_OIDC_AUDIENCE: ia-fiscal-knowledge-ocr-qvgenxcrdrqyiyozxtdt
      OCR_ALLOWED_REPOSITORY: AlmoreContabilidade/Ia-fiscal
      OCR_ALLOWED_REPOSITORY_ID: "1320619695"
      OCR_ALLOWED_REPOSITORY_OWNER_ID: "296187202"
      OCR_ALLOWED_REF: refs/heads/main
      OCR_ALLOWED_WORKFLOW_REF: AlmoreContabilidade/Ia-fiscal/.github/workflows/knowledge-ocr.yml@refs/heads/main
      OCR_GITHUB_ENVIRONMENT: knowledge-ocr
      OCR_ALLOWED_DOWNLOAD_HOSTS: qvgenxcrdrqyiyozxtdt.supabase.co
      OCR_MAX_JOBS: "1"
      OCR_JOB_DEADLINE_SECONDS: "2400"
      OCR_DPI: "300"
      OCR_MIN_PAGE_COVERAGE_BPS: "9000"
      OCR_MIN_MEAN_CONFIDENCE_MILLI: "550"

    steps:
      - name: Reject execution outside the protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "AlmoreContabilidade/Ia-fiscal"

      - name: Configure runner-local summary path
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          printf 'OCR_SUMMARY_PATH=%s\n' \
            "$RUNNER_TEMP/knowledge-ocr-summary.json" >> "$GITHUB_ENV"

      - name: Checkout immutable workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      - name: Install the locked OCR toolchain
        shell: bash
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

          os_id="$(. /etc/os-release && printf '%s' "$ID")"
          os_version="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
          test "$os_id" = "ubuntu"
          test "$os_version" = "24.04"
          test "$(dpkg --print-architecture)" = "amd64"
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg

          primary_sources="$RUNNER_TEMP/knowledge-ocr-ubuntu-primary.sources"
          fallback_sources="$RUNNER_TEMP/knowledge-ocr-ubuntu-fallback.sources"
          primary_lists="$RUNNER_TEMP/knowledge-ocr-apt-primary"
          fallback_lists="$RUNNER_TEMP/knowledge-ocr-apt-fallback"

          printf '%s\n' \
            'Types: deb' \
            'URIs: http://azure.archive.ubuntu.com/ubuntu/' \
            'Suites: noble noble-updates' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu/' \
            'Suites: noble-security' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            > "$primary_sources"

          printf '%s\n' \
            'Types: deb' \
            'URIs: http://archive.ubuntu.com/ubuntu/' \
            'Suites: noble noble-updates' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu/' \
            'Suites: noble-security' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            > "$fallback_sources"

          OCR_PACKAGES=(
            bubblewrap=0.9.0-1ubuntu0.1
            poppler-utils=24.02.0-1ubuntu9.9
            qpdf=11.9.0-1.1ubuntu0.1
            tesseract-ocr=5.3.4-1build5
            tesseract-ocr-por=1:4.1.0-2
            unrtf=0.21.10-clean-1
          )
          readonly OCR_PACKAGES

          APT_COMMON=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
            -o Acquire::ForceIPv4=true
            -o DPkg::Lock::Timeout=30
            -o Dpkg::Use-Pty=0
            -o Dir::Etc::sourceparts="-"
          )
          readonly APT_COMMON

          prepare_lists() {
            local lists="$1"
            sudo install -d -m 0755 "$lists"
            sudo install -d -o _apt -g root -m 0700 "$lists/partial"
          }

          apt_update() {
            local sources="$1"
            local lists="$2"
            local budget="$3"
            prepare_lists "$lists"
            sudo timeout --signal=TERM --kill-after=15s "$budget" \
              apt-get "${APT_COMMON[@]}" \
              -o Dir::Etc::sourcelist="$sources" \
              -o Dir::State::lists="$lists" \
              update
          }

          pinned_candidates_available() {
            local sources="$1"
            local lists="$2"
            local specification package expected candidate
            for specification in "${OCR_PACKAGES[@]}"; do
              package="${specification%%=*}"
              expected="${specification#*=}"
              candidate="$(
                apt-cache "${APT_COMMON[@]}" \
                  -o Dir::Etc::sourcelist="$sources" \
                  -o Dir::State::lists="$lists" \
                  policy "$package" |
                  awk '$1 == "Candidate:" { print $2 }'
              )"
              if test "$candidate" != "$expected"; then
                printf 'Pinned candidate unavailable: %s=%s\n' \
                  "$package" "$expected" >&2
                return 1
              fi
            done
          }

          selected_sources="$primary_sources"
          selected_lists="$primary_lists"
          if ! apt_update "$primary_sources" "$primary_lists" 45s || \
            ! pinned_candidates_available "$primary_sources" "$primary_lists"; then
            echo "::warning::Azure Ubuntu mirror failed; using the signed official Ubuntu fallback"
            selected_sources="$fallback_sources"
            selected_lists="$fallback_lists"
            apt_update "$fallback_sources" "$fallback_lists" 75s
            pinned_candidates_available "$fallback_sources" "$fallback_lists"
          fi

          sudo timeout --signal=TERM --kill-after=15s 150s \
            apt-get "${APT_COMMON[@]}" \
            -o Dir::Etc::sourcelist="$selected_sources" \
            -o Dir::State::lists="$selected_lists" \
            -y --no-install-recommends --allow-downgrades --no-remove \
            install "${OCR_PACKAGES[@]}"

      - name: Verify toolchain and fail-closed unit tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.knowledge_ocr.verify_toolchain
          python -m unittest discover -s scripts/knowledge_ocr/tests -v

      - name: Drain governed OCR queue
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=60s 45m \
            python -m scripts.knowledge_ocr.worker

      - name: Verify non-sensitive run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$OCR_SUMMARY_PATH"; then
            python - "$OCR_SUMMARY_PATH" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = {"text", "content", "url", "token", "lease_token", "source"}

          def inspect(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in forbidden:
                          raise SystemExit("sensitive summary field rejected")
                      inspect(item)
              elif isinstance(value, list):
                  for item in value:
                      inspect(item)

          inspect(data)
          if path.stat().st_size > 64 * 1024:
              raise SystemExit("summary size limit exceeded")
          PY
          fi

      - name: Upload metadata-only summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-ocr-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-ocr-summary.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9
          include-hidden-files: false
