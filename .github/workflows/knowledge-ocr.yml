name: Governed knowledge OCR

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ia-fiscal-governed-knowledge-ocr-production
  cancel-in-progress: false

jobs:
  ocr:
    name: OCR official legal artifact
    runs-on: ubuntu-24.04
    environment: knowledge-ocr
    timeout-minutes: 65

    env:
      OCR_EDGE_URL: https://qvgenxcrdrqyiyozxtdt.supabase.co/functions/v1/ia-fiscal-knowledge-ocr
      OCR_OIDC_AUDIENCE: ia-fiscal-knowledge-ocr-qvgenxcrdrqyiyozxtdt
      OCR_ALLOWED_REPOSITORY: AlmoreContabilidade/Ia-fiscal
      OCR_ALLOWED_REPOSITORY_ID: "1320619695"
      OCR_ALLOWED_REPOSITORY_OWNER_ID: "296187202"
      OCR_ALLOWED_REF: refs/heads/main
      OCR_ALLOWED_WORKFLOW_REF: AlmoreContabilidade/Ia-fiscal/.github/workflows/knowledge-ocr.yml@refs/heads/main
      OCR_GITHUB_ENVIRONMENT: knowledge-ocr
      OCR_ALLOWED_DOWNLOAD_HOSTS: qvgenxcrdrqyiyozxtdt.supabase.co
      OCR_MAX_JOBS: "1"
      OCR_JOB_DEADLINE_SECONDS: "2400"
      OCR_DPI: "300"
      OCR_MIN_PAGE_COVERAGE_BPS: "9000"
      OCR_MIN_MEAN_CONFIDENCE_MILLI: "550"

    steps:
      - name: Reject execution outside the protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "AlmoreContabilidade/Ia-fiscal"

      - name: Configure runner-local summary path
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          printf 'OCR_SUMMARY_PATH=%s\n' \
            "$RUNNER_TEMP/knowledge-ocr-summary.json" >> "$GITHUB_ENV"

      - name: Checkout immutable workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.11"

      - name: Install the locked OCR toolchain
        shell: bash
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

          os_id="$(. /etc/os-release && printf '%s' "$ID")"
          os_version="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
          test "$os_id" = "ubuntu"
          test "$os_version" = "24.04"
          test "$(dpkg --print-architecture)" = "amd64"
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg

          primary_sources="$RUNNER_TEMP/knowledge-ocr-ubuntu-primary.sources"
          fallback_sources="$RUNNER_TEMP/knowledge-ocr-ubuntu-fallback.sources"

          apt_state_root="$(sudo mktemp -d /var/lib/apt/ia-fiscal-ocr.XXXXXXXX)"
          sudo chmod 0755 "$apt_state_root"
          primary_lists="$apt_state_root/primary"
          fallback_lists="$apt_state_root/fallback"

          validate_apt_state_root() {
            local candidate="$1"
            case "$candidate" in
              /var/lib/apt/ia-fiscal-ocr.*) ;;
              *) return 1 ;;
            esac
            test "$(dirname -- "$candidate")" = "/var/lib/apt" || return 1
            test "$candidate" != "/var/lib/apt/ia-fiscal-ocr." || return 1
            test ! -L "$candidate" || return 1
            test "$(readlink -f -- "$candidate")" = "$candidate" || return 1
            test -d "$candidate" || return 1
            test "$(sudo stat -c '%U:%G:%a' -- "$candidate")" = \
              "root:root:755" || return 1
          }

          cleanup_apt_state() {
            local status=$?
            trap - EXIT
            if ! validate_apt_state_root "$apt_state_root"; then
              echo "::error::Refusing unsafe APT state cleanup target"
              exit 70
            fi
            if ! sudo rm -rf --one-file-system -- "$apt_state_root"; then
              echo "::error::Failed to clean the isolated APT state"
              exit 71
            fi
            exit "$status"
          }

          validate_apt_state_root "$apt_state_root"
          trap cleanup_apt_state EXIT

          printf '%s\n' \
            'Types: deb' \
            'URIs: http://azure.archive.ubuntu.com/ubuntu/' \
            'Suites: noble noble-updates' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu/' \
            'Suites: noble-security' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            > "$primary_sources"

          printf '%s\n' \
            'Types: deb' \
            'URIs: http://archive.ubuntu.com/ubuntu/' \
            'Suites: noble noble-updates' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            '' \
            'Types: deb' \
            'URIs: http://security.ubuntu.com/ubuntu/' \
            'Suites: noble-security' \
            'Components: main universe' \
            'Architectures: amd64' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
            > "$fallback_sources"

          OCR_PACKAGES=(
            bubblewrap=0.9.0-1ubuntu0.1
            poppler-utils=24.02.0-1ubuntu9.9
            qpdf=11.9.0-1.1ubuntu0.1
            tesseract-ocr=5.3.4-1build5
            tesseract-ocr-por=1:4.1.0-2
            unrtf=0.21.10-clean-1
          )
          readonly OCR_PACKAGES

          APT_COMMON=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
            -o Acquire::ForceIPv4=true
            -o APT::Sandbox::User=_apt
            -o DPkg::Lock::Timeout=30
            -o Dpkg::Use-Pty=0
            -o Dir::Etc::sourceparts="-"
          )
          readonly APT_COMMON
          apt_sandbox_guard_failed=0

          prepare_lists() {
            local lists="$1"
            local parent
            if test "$lists" != "$primary_lists" && \
              test "$lists" != "$fallback_lists"; then
              return 1
            fi
            validate_apt_state_root "$apt_state_root" || return 1
            sudo install -d -o root -g root -m 0755 "$lists" || return 1
            sudo install -d -o _apt -g root -m 0700 "$lists/partial" || return 1
            test "$(sudo stat -c '%U:%G:%a' -- "$lists")" = \
              "root:root:755" || return 1
            test "$(sudo stat -c '%U:%G:%a' -- "$lists/partial")" = \
              "_apt:root:700" || return 1
            for parent in /var /var/lib /var/lib/apt "$apt_state_root" "$lists"; do
              sudo -u _apt test -x "$parent" || return 1
            done
            sudo -u _apt test -w "$lists/partial" || return 1
          }

          run_apt_checked() {
            local log="$1"
            shift || return 1
            local -a statuses
            local warning_status
            case "$log" in
              "$apt_state_root"/apt-*.log) ;;
              *) return 1 ;;
            esac
            set +e
            "$@" 2>&1 | sudo tee "$log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            if test "${statuses[1]}" -ne 0; then
              apt_sandbox_guard_failed=1
              echo "::error::APT sandbox log could not be verified"
              return 1
            fi
            if sudo grep -Fq "Download is performed unsandboxed as root" "$log"; then
              warning_status=0
            else
              warning_status=$?
            fi
            case "$warning_status" in
              0)
                apt_sandbox_guard_failed=1
                echo "::error::APT sandbox fallback was rejected"
                return 1
                ;;
              1) ;;
              *)
                apt_sandbox_guard_failed=1
                echo "::error::APT sandbox log could not be verified"
                return 1
                ;;
            esac
            if test "${statuses[0]}" -ne 0; then
              return 1
            fi
            return 0
          }

          apt_update() {
            local sources="$1"
            local lists="$2"
            local budget="$3"
            local label
            prepare_lists "$lists" || return 1
            label="$(basename -- "$lists")" || return 1
            run_apt_checked "$apt_state_root/apt-update-$label.log" \
              sudo timeout --signal=TERM --kill-after=15s "$budget" \
                apt-get "${APT_COMMON[@]}" \
                -o Dir::Etc::sourcelist="$sources" \
                -o Dir::State::lists="$lists" \
                update || return 1
          }

          pinned_candidates_available() {
            local sources="$1"
            local lists="$2"
            local specification package expected candidate
            for specification in "${OCR_PACKAGES[@]}"; do
              package="${specification%%=*}"
              expected="${specification#*=}"
              if ! candidate="$(
                apt-cache "${APT_COMMON[@]}" \
                  -o Dir::Etc::sourcelist="$sources" \
                  -o Dir::State::lists="$lists" \
                  policy "$package" |
                  awk '$1 == "Candidate:" { print $2 }'
              )"; then
                return 1
              fi
              if test "$candidate" != "$expected"; then
                printf 'Pinned candidate unavailable: %s=%s\n' \
                  "$package" "$expected" >&2
                return 1
              fi
            done
          }

          selected_sources="$primary_sources"
          selected_lists="$primary_lists"
          if ! apt_update "$primary_sources" "$primary_lists" 45s || \
            ! pinned_candidates_available "$primary_sources" "$primary_lists"; then
            if test "$apt_sandbox_guard_failed" -ne 0; then
              exit 65
            fi
            echo "::warning::Azure Ubuntu mirror failed; using the signed official Ubuntu fallback"
            selected_sources="$fallback_sources"
            selected_lists="$fallback_lists"
            apt_update "$fallback_sources" "$fallback_lists" 75s
            pinned_candidates_available "$fallback_sources" "$fallback_lists"
          fi

          run_apt_checked "$apt_state_root/apt-install.log" \
            sudo timeout --signal=TERM --kill-after=15s 150s \
              apt-get "${APT_COMMON[@]}" \
              -o Dir::Etc::sourcelist="$selected_sources" \
              -o Dir::State::lists="$selected_lists" \
              -y --no-install-recommends --allow-downgrades --no-remove \
              install "${OCR_PACKAGES[@]}"

      - name: Load the locked bwrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail

          apparmor_userns_control=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          test -r "$apparmor_userns_control"
          IFS= read -r apparmor_userns_restricted < "$apparmor_userns_control"
          test "$apparmor_userns_restricted" = "1"
          test "$(dpkg-query -W -f='${Version}' apparmor)" = \
            "4.0.1really4.0.1-0ubuntu0.24.04.7"
          bwrap_path="$(command -v bwrap)"
          test "$bwrap_path" = "/usr/bin/bwrap"
          test "$(readlink -f -- "$bwrap_path")" = "/usr/bin/bwrap"
          test -x /usr/bin/aa-enabled
          sudo /usr/bin/aa-enabled --quiet
          test -x /sbin/apparmor_parser

          profile="$GITHUB_WORKSPACE/scripts/knowledge_ocr/bwrap-userns-restrict.apparmor"
          expected_sha256=43710aa4047dcf100da71f7d924d28db4f036db4d2ae8b65a6bac2e419d168b2
          test -r "$profile"
          printf '%s  %s\n' "$expected_sha256" "$profile" | \
            sha256sum --check --status

          sudo /sbin/apparmor_parser --replace --skip-read-cache --quiet "$profile"
          sudo grep -Fqx 'bwrap (enforce)' \
            /sys/kernel/security/apparmor/profiles
          sudo grep -Fqx 'unpriv_bwrap (enforce)' \
            /sys/kernel/security/apparmor/profiles

          IFS= read -r apparmor_userns_restricted < "$apparmor_userns_control"
          test "$apparmor_userns_restricted" = "1"

      - name: Verify toolchain and fail-closed unit tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.knowledge_ocr.verify_toolchain
          python -m unittest discover -s scripts/knowledge_ocr/tests -v

      - name: Drain governed OCR queue
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=60s 45m \
            python -m scripts.knowledge_ocr.worker

      - name: Verify non-sensitive run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$OCR_SUMMARY_PATH"; then
            python - "$OCR_SUMMARY_PATH" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          forbidden = {"text", "content", "url", "token", "lease_token", "source"}

          def inspect(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in forbidden:
                          raise SystemExit("sensitive summary field rejected")
                      inspect(item)
              elif isinstance(value, list):
                  for item in value:
                      inspect(item)

          inspect(data)
          if path.stat().st_size > 64 * 1024:
              raise SystemExit("summary size limit exceeded")
          PY
          fi

      - name: Upload metadata-only summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-ocr-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/knowledge-ocr-summary.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9
          include-hidden-files: false
